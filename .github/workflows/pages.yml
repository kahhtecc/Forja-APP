name: Site (app web + privacidade)

on:
  push:
    branches: [ "claude/**", "main" ]
    paths: [ "web/**", "app/src/main/assets/video3d/**", ".github/workflows/pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/video3d
          cp app/src/main/assets/video3d/* _site/video3d/ 2>/dev/null || echo '{}' > _site/video3d/meta.json
          sed -i "s/forja-dev/forja-${{ github.run_number }}/" _site/sw.js
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: publicar
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
