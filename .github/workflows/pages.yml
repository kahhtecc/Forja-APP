name: Site (app web + privacidade)

on:
  push:
    branches: [ "claude/**", "main" ]
    paths: [ "web/**", "app/src/main/assets/anim3d/**", ".github/workflows/pages.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/anim3d
          cp app/src/main/assets/anim3d/*.webp app/src/main/assets/anim3d/meta.json _site/anim3d/ 2>/dev/null || echo '{}' > _site/anim3d/meta.json
          sed -i "s/forja-dev/forja-${{ github.run_number }}/" _site/sw.js
          touch _site/.nojekyll
          du -sh _site
      - name: Publicar no branch gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Site do Forja (run ${{ github.run_number }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Site: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
