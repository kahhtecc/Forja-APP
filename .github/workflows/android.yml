name: Android APK

on:
  push:
    branches: [ "claude/**", "main" ]
    paths-ignore: [ "tools/**", "pesquisa/**", "ios/**", "web/**", "PROGRESSO.md", ".github/workflows/ios.yml", ".github/workflows/pages.yml", ".github/workflows/anim3d.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Chave de assinatura (se configurada nos secrets)
        env:
          KS: ${{ secrets.FORJA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/forja.jks"; echo "FORJA_KEYSTORE=$RUNNER_TEMP/forja.jks" >> "$GITHUB_ENV"; echo "assinando com a chave própria"; else echo "::warning::Sem FORJA_KEYSTORE_BASE64: release assinado com a chave de depuração"; fi

      - name: Compilar APKs
        env:
          FORJA_KEYSTORE_SENHA: ${{ secrets.FORJA_KEYSTORE_SENHA }}
          FORJA_CHAVE_ALIAS: ${{ secrets.FORJA_CHAVE_ALIAS }}
          FORJA_CHAVE_SENHA: ${{ secrets.FORJA_CHAVE_SENHA }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log
          # pacote para a Play Store (AAB, sem o aviso de APK novo)
          ./gradlew bundleRelease -Pplay --stacktrace 2>&1 | tee -a build.log

      - name: Mostrar erros de compilação
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|Lint found" -A4 build.log | head -120 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador · capturas e testes de interface
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/screens.sh

      - name: Resultado dos testes de interface
        if: always()
        run: |
          [ -f shots/resultado.txt ] && cat shots/resultado.txt && grep -E "CRASH|FALHA" shots/resultado.txt | while IFS= read -r l; do echo "::warning::$l"; done || true

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Forja-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Forja-${{ github.run_number }}-debug.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Forja-${{ github.run_number }}-play.aab"
          files=$(find shots -type f -size +0 2>/dev/null | tr '\n' ' ')
          if [ -n "${FORJA_KEYSTORE:-}" ]; then
            # assinado com a chave do Forja: vira "build-N", que o app oferece como atualização
            gh release create "build-${{ github.run_number }}" dist/* $files \
              --target "${{ github.sha }}" --prerelease \
              --title "Forja · build ${{ github.run_number }}" \
              --notes "APK do Forja (commit ${{ github.sha }}). Instale o Forja-${{ github.run_number }}.apk. Capturas automáticas do emulador anexadas."
          else
            # sem a chave (secrets não configurados): só para teste. O app ignora tags que não começam com "build-",
            # então ninguém recebe aviso de atualização para um APK com outra assinatura.
            gh release create "teste-${{ github.run_number }}" dist/* $files \
              --target "${{ github.sha }}" --prerelease \
              --title "Forja · teste ${{ github.run_number }} (chave de depuração)" \
              --notes "Build de teste assinado com a chave de depuração: não atualiza o Forja instalado. Configure os secrets FORJA_* (docs/PUBLICAR.md) para gerar builds oficiais."
          fi
