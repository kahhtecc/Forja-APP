name: Sonda de bibliotecas (temporária)
on:
  push:
    paths: [ ".github/workflows/sonda.yml" ]
jobs:
  sonda:
    runs-on: ubuntu-24.04
    steps:
      - name: Versões e APIs
        run: |
          set +e
          G=https://dl.google.com/dl/android/maven2
          a=androidx/wear/wear-ongoing
          curl -s $G/$a/maven-metadata.xml | grep -o '<version>[^<]*' | tail -12
          v=$(curl -s $G/$a/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | grep -v -E 'alpha|beta|rc' | tail -1); echo "usando $v"
          curl -s -o o.aar $G/$a/$v/wear-ongoing-$v.aar; mkdir x; cd x; unzip -q ../o.aar; unzip -q classes.jar; grep -o 'minSdkVersion="[0-9]*"' AndroidManifest.xml
          curl -s $G/$a/$v/wear-ongoing-$v.pom | grep -E '<(artifactId|version)>' | paste - -
          for c in androidx.wear.ongoing.OngoingActivity 'androidx.wear.ongoing.OngoingActivity$Builder' androidx.wear.ongoing.Status 'androidx.wear.ongoing.Status$Builder' 'androidx.wear.ongoing.Status$TimerPart' 'androidx.wear.ongoing.Status$StopwatchPart' 'androidx.wear.ongoing.Status$TextPart'; do echo "---- $c"; javap -cp . "$c"; done
