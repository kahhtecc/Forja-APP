name: iOS

on:
  push:
    branches: [ "claude/**", "main" ]
    paths: [ "ios/**", "app/src/main/assets/**", ".github/workflows/ios.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel  # os macOS com chip Apple estão sem capacidade (fila sem fim)
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_1[6-9]*.app /Applications/Xcode_2*.app 2>/dev/null | grep -v beta | sort -V | tail -1)"
          xcodebuild -version

      - name: Testes do núcleo (paridade com o Android)
        working-directory: ios/ForjaCore
        run: swift test 2>&1 | tail -40

      - name: Gerar projeto (XcodeGen)
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar para o simulador
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Forja.xcodeproj -scheme Forja -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E "error:" -A3 build.log | head -80 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Capturas no simulador
        continue-on-error: true
        working-directory: ios
        run: |
          set -x
          dev=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone 16 Pro' == x['name']] + [x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')])[0])")
          xcrun simctl boot "$dev"; xcrun simctl bootstatus "$dev" -b
          app=$(find build/Build/Products -name "Forja.app" -maxdepth 3 | head -1)
          xcrun simctl install "$dev" "$app"
          mkdir -p ../shots-ios
          for t in hoje plano sessao treino mobilidade exercicios exercicio:agachamento-barra progresso perfil cardiaco concluido quiz rotina:pre-corrida; do
            xcrun simctl terminate "$dev" com.kaiquecupertino.forja || true
            xcrun simctl launch "$dev" com.kaiquecupertino.forja -demo 1 -tela "$t"
            sleep 14
            xcrun simctl io "$dev" screenshot "../shots-ios/ios-${t//:/_}.png"
          done
          # primeira abertura (sem plano): questionário
          xcrun simctl terminate "$dev" com.kaiquecupertino.forja || true
          xcrun simctl launch "$dev" com.kaiquecupertino.forja
          sleep 5
          xcrun simctl io "$dev" screenshot ../shots-ios/ios-boasvindas.png
          xcrun simctl spawn "$dev" log show --last 5m --predicate 'process == "Forja"' --style compact | grep -iE "fatal|crash" | head -20 || true

      - name: IPA (não assinado)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Forja.xcodeproj -scheme Forja -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-dev \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tail -5
          mkdir -p Payload
          cp -R build-dev/Build/Products/Release-iphoneos/Forja.app Payload/
          # a extensão da Live Activity (tela bloqueada, Dynamic Island, Apple Watch) precisa ir dentro do app
          test -d Payload/Forja.app/PlugIns/ForjaWidgets.appex || { echo "::error::ForjaWidgets.appex não está no IPA"; exit 1; }
          ls Payload/Forja.app/PlugIns
          # manifestos de privacidade (exigidos pela App Store) no app e na extensão
          test -f Payload/Forja.app/PrivacyInfo.xcprivacy || { echo "::error::PrivacyInfo.xcprivacy faltando no app"; exit 1; }
          test -f Payload/Forja.app/PlugIns/ForjaWidgets.appex/PrivacyInfo.xcprivacy || { echo "::error::PrivacyInfo.xcprivacy faltando na extensão"; exit 1; }
          zip -qry "../Forja-ios-${{ github.run_number }}.ipa" Payload

      - name: Guardar IPA e capturas (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: forja-ios-${{ github.run_number }}
          path: |
            Forja-ios-*.ipa
            shots-ios/

      - name: Publicar release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(find shots-ios -type f -size +0 2>/dev/null | tr '\n' ' ')
          for i in 1 2 3 4; do gh release create "ios-${{ github.run_number }}" Forja-ios-*.ipa $files \
            --target "${{ github.sha }}" --prerelease \
            --title "Forja iOS · build ${{ github.run_number }}" \
            --notes "IPA não assinado do Forja para iPhone (commit ${{ github.sha }}). Instale com Sideloadly ou AltStore (assina com seu Apple ID). Inclui a Live Activity do treino (tela bloqueada, Dynamic Island e Smart Stack do Apple Watch no watchOS 11+), app Saúde e monitor cardíaco Bluetooth. Capturas do simulador anexadas." && break; sleep $((i*15)); done

      # Com conta paga da Apple (secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID): assina e envia ao TestFlight.
      - name: TestFlight
        if: env.ASC_KEY_ID != ''
        working-directory: ios
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          chave="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; printf '%s' "$ASC_KEY_P8" > "$chave"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$chave" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project Forja.xcodeproj -scheme Forja -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Forja.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} "${auth[@]}" archive 2>&1 | tail -20
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Forja.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${auth[@]}" 2>&1 | tail -20
