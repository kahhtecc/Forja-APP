<style>
html { -webkit-text-size-adjust: 100%; } body { overscroll-behavior-y: none; }
/* Layout: app de uma coluna (máx. 480px) com barra de 5 abas flutuante; tema escuro único, igual ao app Android/iPhone. */
:root {
  --fundo: #0E0D0C; --sup1: #161412; --sup2: #1E1B18; --sup3: #28241F; --borda: #35302A;
  --texto: #F2EBE0; --texto2: #A89E90; --texto3: #6E665C;
  --brasa: #FF5B22; --brasa-clara: #FF8A50; --ok: #34D399; --alerta: #FBBF24; --perigo: #F43F5E;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --corpo: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --lado: max(20px, env(safe-area-inset-left, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { background: var(--fundo); color: var(--texto); font-family: var(--corpo); font-size: 15px; line-height: 1.45; margin: 0; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fundo); }
button, a { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-decoration: none; text-align: inherit; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px solid var(--brasa); outline-offset: 2px; border-radius: 12px; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-top: env(safe-area-inset-top, 0px); }
.pag { padding: 8px var(--lado) 120px; }
.tela-sessao .pag, .tela-rotina .pag, .tela-exercicio .pag { padding-bottom: 20px; }
.rotulo { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--texto3); }
h1, h2, h3, .num, .numero, .marcaForja { font-family: var(--display); font-weight: 900; margin: 0; line-height: 1.02; text-wrap: balance; }
h1 { font-size: 38px; } h2 { font-size: 28px; font-weight: 800; } h3 { font-size: 21px; font-weight: 800; }
p { margin: 0; } small { font-size: 13px; }
.mut { color: var(--texto2); } .mut3 { color: var(--texto3); } .peq { font-size: 13px; } .blk { display: block; }
.umaLinha { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duasLinhas { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pilha { display: flex; flex-direction: column; gap: 12px; }
.linha { display: flex; align-items: center; gap: 12px; min-width: 0; }
.cresce { flex: 1; min-width: 0; }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.cartao { display: block; width: 100%; background: var(--sup1); border: 1px solid var(--borda); border-radius: 22px; padding: 18px; }
.cartao.p16 { padding: 16px; } .cartao.p14 { padding: 14px; } .cartao.p12 { padding: 12px; }
.etq { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; font-size: 13px; font-weight: 700; background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); white-space: nowrap; flex: none; }
.etq.cheia { background: var(--c); color: var(--fundo); }
.etq.foto { background: rgba(14,13,12,.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.btn { display: flex; width: 100%; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 18px; font-weight: 800; font-size: 15px; letter-spacing: .02em; background: linear-gradient(120deg, var(--brasa-clara), var(--brasa) 55%, #D9381E); color: #fff; text-align: center; }
.btn[data-cor] { background: var(--c); color: var(--fundo); }
.btn:disabled { background: var(--sup3); color: var(--texto3); cursor: default; }
.btn2 { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 16px; background: var(--sup2); border: 1px solid var(--borda); font-weight: 800; text-align: center; }
.btn2.largo { display: flex; width: 100%; }
.ico { width: 46px; height: 46px; border-radius: 50%; background: var(--sup2); border: 1px solid var(--borda); display: grid; place-items: center; flex: none; color: var(--texto); }
.icoR { border-radius: 50%; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 16%, transparent); }
.estat b { display: block; font-size: 34px; } .estat span { display: block; font-size: 12px; color: var(--texto2); margin-top: 4px; line-height: 1.3; }
.barra { height: 5px; border-radius: 9px; background: var(--sup3); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--c, var(--brasa)); border-radius: 9px; transition: width .4s; }
.secao { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 12px; gap: 12px; }
.secao button { color: var(--brasa); font-weight: 700; font-size: 13px; white-space: nowrap; }
.linhaBrasa { width: 36px; height: 3px; border-radius: 9px; background: linear-gradient(90deg, var(--c, var(--brasa)), transparent); flex: none; }
.ponto { width: 6px; height: 6px; border-radius: 50%; flex: none; margin-top: 8px; display: block; }
.aviso { display: flex; gap: 10px; padding: 14px; border-radius: 16px; background: rgba(251,191,36,.1); font-size: 13px; align-items: flex-start; }
.aviso svg { flex: none; }
.okBox { display: flex; gap: 8px; align-items: center; padding: 12px; border-radius: 14px; background: rgba(52,211,153,.1); color: var(--ok); font-size: 13px; margin: 4px 0; }
.anel { position: relative; display: grid; place-items: center; flex: none; }
.anel > svg { position: absolute; inset: 0; transform: rotate(-90deg); width: 100%; height: 100%; }
.anel .arco { transition: stroke-dashoffset .3s linear; }
.anel .dentro { position: relative; display: grid; place-items: center; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--brasa-clara), var(--brasa) 60%, #D9381E); color: #fff; display: grid; place-items: center; font-family: var(--display); font-size: 22px; font-weight: 900; flex: none; }
.avatar.grande { width: 58px; height: 58px; font-size: 28px; }
.vazio { text-align: center; padding: 40px 20px; display: grid; justify-items: center; gap: 8px; }

/* demonstração 3D: quadrado 1,12× a altura, centralizado, bordas esmaecidas (igual ao app) */
.demo { position: relative; overflow: hidden; background: #1B1713; aspect-ratio: 1.45; width: 100%; }
.demo video, .demo img { position: absolute; top: -6%; height: 112%; aspect-ratio: 1; width: auto; left: 50%; transform: translateX(-50%); object-fit: contain;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.demo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 70%, rgba(0,0,0,.28)); pointer-events: none; }
.demo .sem { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 44px; color: var(--c); background: radial-gradient(color-mix(in srgb, var(--c) 30%, transparent), var(--sup2)); }
.mini { width: 64px; height: 64px; flex: none; } .mini .demo, .mini56 .demo, .mini70 .demo, .mini72 .demo, .mini76 .demo { aspect-ratio: 1; height: 100%; }
.mini56 { width: 56px; height: 56px; flex: none; } .mini70 { width: 70px; height: 70px; flex: none; } .mini72 { width: 72px; height: 72px; flex: none; position: relative; } .mini76 { width: 76px; height: 76px; flex: none; }
.feitaV { position: absolute; inset: 0; border-radius: 16px; background: rgba(52,211,153,.55); display: grid; place-items: center; }

/* abas */
.abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px max(14px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.abas nav { max-width: 452px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px; border-radius: 28px; background: rgba(30,27,24,.97); border: 1px solid var(--borda); box-shadow: 0 18px 40px rgba(0,0,0,.5); pointer-events: auto; }
.abas button { padding: 8px 0; border-radius: 22px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--texto3); min-width: 0; }
.abas button span { font-size: 10.5px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
.abas button[aria-current="page"] { background: rgba(255,91,34,.14); color: var(--brasa); }
.abas button[aria-current="page"] span { color: var(--texto); }

/* questionário */
.quiz { min-height: 100vh; display: flex; flex-direction: column; }
.quizTopo { display: flex; align-items: center; gap: 16px; padding: 12px var(--lado); }
.quizCorpo { flex: 1; padding: 18px 22px 24px; }
.opc { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border-radius: 18px; background: var(--sup1); border: 1.5px solid var(--borda); }
.opc b { display: block; } .opc small { display: block; color: var(--texto2); }
.opc[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--sup1)); }
.opc .marca { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--texto3); flex: none; display: grid; place-items: center; }
.opc.multi .marca { border-radius: 7px; }
.opc[aria-pressed="true"] .marca { background: var(--c); border-color: var(--c); }
.pilulas { display: flex; flex-wrap: wrap; gap: 10px; }
.pilula { width: 100px; height: 56px; border-radius: 16px; background: var(--sup1); border: 1.5px solid var(--borda); font-family: var(--display); font-size: 21px; font-weight: 800; color: var(--texto2); text-align: center; }
.pilula[aria-pressed="true"] { background: rgba(255,91,34,.16); border-color: var(--brasa); color: var(--texto); }
.seletorNum { display: flex; flex-direction: column; align-items: stretch; }
.numero { font-size: 88px; line-height: .95; text-align: center; } .numero.vazio { color: var(--texto3); }
input[type=range] { width: 100%; margin-top: 24px; accent-color: var(--brasa); height: 32px; }
.limpar { align-self: center; margin-top: 12px; padding: 8px; font-weight: 800; font-size: 13px; color: var(--texto2); }
.diasSel { display: flex; justify-content: space-between; gap: 4px; }
.diasSel button { width: 44px; height: 44px; border-radius: 50%; background: var(--sup2); border: 1px solid var(--borda); font-size: 13px; font-weight: 800; color: var(--texto2); text-align: center; }
.diasSel button[aria-pressed="true"] { background: var(--brasa); border-color: var(--brasa); color: #fff; }
.campoNome { width: 100%; background: var(--sup1); border: 1px solid var(--borda); border-radius: 18px; padding: 20px; color: var(--texto); font-family: var(--display); font-size: 28px; font-weight: 800; }
.campoNome::placeholder { color: var(--texto3); }
.fixo { position: sticky; bottom: 0; padding: 24px 22px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--fundo) 30%); z-index: 3; }
.fixo.pag { padding-left: var(--lado); padding-right: var(--lado); }
.boas { position: relative; min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; }
.boas .mosaico { position: absolute; top: 8px; left: 12px; right: 12px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; }
.boas .mosaico img { width: 100%; height: 100%; object-fit: cover; border-radius: 22px; display: block; background: var(--sup2); }
.boas .mosaico > img { aspect-ratio: .72; } .boas .mosaico .col { display: grid; gap: 8px; } .boas .mosaico .col img:first-child { aspect-ratio: .95; } .boas .mosaico .col img:last-child { aspect-ratio: 1.05; }
.boas::before { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 25%, var(--fundo) 58%); z-index: 1; }
.boasTexto { position: relative; z-index: 2; padding: 24px 24px calc(24px + env(safe-area-inset-bottom, 0px)); }
.marcaForja { font-size: 84px; letter-spacing: 2px; margin-top: 14px; line-height: .95; }
.gerando { padding: 54px 24px 40px; }
.bolinha { width: 22px; height: 22px; border-radius: 50%; background: var(--sup3); display: grid; place-items: center; flex: none; } .bolinha.ok { background: var(--ok); }

/* hoje */
.heroi { position: relative; height: 380px; border-radius: 28px; overflow: hidden; border: 1px solid var(--borda); background: var(--sup2); cursor: pointer; }
.heroi .heroiDemo { position: absolute; inset: 0 0 auto; height: 290px; aspect-ratio: auto; }
.heroi .veu { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.2) 38%, rgba(14,13,12,.85) 70%, var(--fundo)), radial-gradient(color-mix(in srgb, var(--c) 22%, transparent), transparent 70%); }
.heroi .topoH { position: absolute; top: 18px; left: 18px; display: flex; gap: 8px; flex-wrap: wrap; }
.heroi .baseH { position: absolute; left: 20px; right: 20px; bottom: 20px; }
.dias { display: flex; justify-content: space-between; }
.dia { width: 42px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--texto3); }
.dia.hoje { color: var(--texto); }
.dia i { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-style: normal; }
.trilho { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin-right: calc(-1 * var(--lado)); padding-right: var(--lado); scroll-padding-left: 0; }
.trilho::-webkit-scrollbar { display: none; }
.trilho > * { flex: none; }
.rotinaP { width: 220px; border-radius: 22px; overflow: hidden; background: var(--sup1); border: 1px solid var(--borda); }
.rotinaP .capa { position: relative; height: 110px; } .rotinaP .capa .demo { height: 110px; aspect-ratio: auto; }
.rotinaP .etqCapa { position: absolute; top: 10px; left: 10px; }
.rotinaP b, .rotinaP small { display: block; }
.chip { padding: 9px 16px; border-radius: 99px; background: var(--sup1); border: 1px solid var(--borda); font-weight: 800; font-size: 13px; color: var(--texto2); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--c); color: var(--fundo); border-color: var(--c); }

/* plano e sessão */
.semana { width: 78px; padding: 12px 0 10px; border-radius: 18px; background: var(--sup1); border: 1px solid var(--borda); display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.semana[aria-pressed="true"] { background: var(--c); color: var(--fundo); border-color: var(--c); }
.semana .num { font-size: 24px; } .semana small { font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--texto3); white-space: nowrap; }
.semana[aria-pressed="true"] small { color: rgba(14,13,12,.8); }
.sessaoC { display: flex; align-items: center; gap: 14px; padding: 14px; text-align: left; }
.detalhe, .detalheEx { position: relative; }
.capaD { position: relative; height: 300px; } .capaD .demo { height: 300px; aspect-ratio: auto; }
.veuD { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.35), transparent 40%, var(--fundo)); }
.voltarFlut { position: absolute; top: 16px; left: 16px; z-index: 2; }
.baseD { position: absolute; left: var(--lado); right: var(--lado); bottom: 8px; }
.item { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 8px 0; }
.item b { display: block; }
.capaEx .demo { aspect-ratio: 1.1; }
.numDica { width: 28px; height: 28px; border-radius: 9px; background: rgba(255,91,34,.15); color: var(--brasa); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.alt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px; border-radius: 18px; background: var(--sup1); border: 1px solid var(--borda); }
.alt b { display: block; }
.linhaAcao { display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px; margin: 5px 0; }
.linhaAcao b, .linhaAcao small { display: block; } .linhaAcao small { color: var(--texto2); }
.linhaRot { display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px; }
.topoT { display: flex; align-items: center; gap: 14px; padding: 12px 0 18px; }
.alternar { display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; }
.alternar span { flex: 1; }
.alternar input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.alternar i { width: 52px; height: 32px; border-radius: 99px; background: var(--sup3); border: 1px solid var(--borda); position: relative; flex: none; transition: background .2s; }
.alternar i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--texto3); transition: transform .2s, background .2s; }
.alternar input:checked + i { background: var(--brasa); border-color: var(--brasa); }
.alternar input:checked + i::after { transform: translateX(20px); background: #fff; }
.alternar input:focus-visible + i { outline: 2px solid var(--brasa); outline-offset: 2px; }

/* biblioteca */
.buscaC { display: flex; align-items: center; gap: 10px; background: var(--sup1); border: 1px solid var(--borda); border-radius: 18px; padding: 0 16px; }
.buscaC input { flex: 1; min-width: 0; background: none; border: 0; color: var(--texto); font: inherit; padding: 14px 0; outline: none; }
.buscaC input::placeholder { color: var(--texto3); }
.grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grade button { text-align: left; background: var(--sup1); border: 1px solid var(--borda); border-radius: 20px; overflow: hidden; }
.grade .gradeDemo { aspect-ratio: 1.25; }
.grade b { font-size: 13px; line-height: 1.3; padding: 12px 12px 4px; min-height: calc(2.6em + 16px); }
.grade small { display: block; padding: 0 12px 12px; color: var(--texto3); font-size: 12px; }
.video { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: #000; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.fonte { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.fonte b { width: 44px; flex: none; font-size: 13px; }

/* treino */
.tela-treino { padding-top: env(safe-area-inset-top, 0px); }
#treino { min-height: 100vh; display: flex; flex-direction: column; }
.treinoTopo { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.segmentos { display: flex; gap: 3px; padding: 0 16px; } .segmentos .barra { height: 4px; }
.treinoCorpo { flex: 1; padding: 14px 20px 16px; }
.treinoControles { position: sticky; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--fundo) 25%); }
.descanso { position: fixed; inset: 0; z-index: 6; background: rgba(14,13,12,.985); display: flex; flex-direction: column; padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 480px; margin: 0 auto; }
.aSeguir { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 20px; background: var(--sup1); border: 1px solid var(--borda); margin: 10px 0 16px; }
.concluido { display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
.selo { width: 110px; height: 110px; border-radius: 50%; background: color-mix(in srgb, var(--c) 15%, transparent); display: grid; place-items: center; margin-bottom: 20px; }
.selo span { width: 78px; height: 78px; border-radius: 50%; background: var(--c); display: grid; place-items: center; }
.esforco { display: flex; justify-content: space-between; width: 100%; margin-top: 12px; gap: 4px; }
.esforco button { width: 30px; height: 30px; border-radius: 9px; background: var(--sup2); font-weight: 800; font-size: 13px; color: var(--texto3); text-align: center; }
.esforco button[aria-pressed="true"] { outline: 2px solid var(--texto); }
.nota { width: 100%; min-height: 90px; margin-top: 20px; background: var(--sup1); border: 1px solid var(--borda); border-radius: 16px; padding: 16px; color: var(--texto); font: inherit; resize: vertical; }
.nota::placeholder { color: var(--texto3); }
.descartar { margin-top: 10px; padding: 10px; color: var(--texto3); font-weight: 800; font-size: 13px; }

/* progresso */
