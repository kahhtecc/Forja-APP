<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Forja · treino sob medida</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rotinas de treino sob medida: musculação, casa, corrida, bike, lutas, atletas, mobilidade e mais.">
<meta name="theme-color" content="#0E0D0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forja">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@500;600;700;800&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; } body { overscroll-behavior-y: none; }
/* Layout: app de uma coluna (máx. 480px) com barra de abas flutuante; tema escuro único, como no APK. */
:root {
  --fundo: #0E0D0C; --sup1: #161412; --sup2: #1E1B18; --sup3: #28241F; --borda: #35302A;
  --texto: #F2EBE0; --texto2: #A89E90; --texto3: #6E665C;
  --brasa: #FF5B22; --brasa-clara: #FF8A50; --ok: #34D399; --alerta: #FBBF24;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --corpo: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--fundo); color: var(--texto); font-family: var(--corpo); font-size: 15px; line-height: 1.45; margin: 0; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fundo); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brasa); outline-offset: 2px; border-radius: 12px; }
#app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(8px + env(safe-area-inset-top, 0px)) 120px; }
.rotulo { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--texto3); }
h1, h2, h3, .num { font-family: var(--display); font-weight: 900; margin: 0; line-height: 1; text-wrap: balance; }
h1 { font-size: 40px; } h2 { font-size: 30px; font-weight: 800; } h3 { font-size: 22px; font-weight: 800; }
p { margin: 0; }
.mut { color: var(--texto2); } .mut3 { color: var(--texto3); } .peq { font-size: 13px; }
.pilha { display: flex; flex-direction: column; gap: 12px; }
.linha { display: flex; align-items: center; gap: 12px; min-width: 0; }
.cresce { flex: 1; min-width: 0; }
.cartao { background: var(--sup1); border: 1px solid var(--borda); border-radius: 22px; padding: 16px; }
.etq { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; font-size: 13px; font-weight: 700; background: color-mix(in srgb, var(--c, var(--brasa)) 15%, transparent); color: var(--c, var(--brasa)); white-space: nowrap; }
.etq.cheia { background: var(--c, var(--brasa)); color: var(--fundo); }
.btn { display: flex; width: 100%; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 18px; font-weight: 800; font-size: 15px; letter-spacing: .02em; background: linear-gradient(120deg, var(--brasa-clara), var(--brasa) 55%, #D9381E); color: #fff; }
.btn.cor { background: var(--c); color: var(--fundo); }
.btn:disabled { background: var(--sup3); color: var(--texto3); cursor: default; }
.btn2 { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 16px; background: var(--sup2); border: 1px solid var(--borda); font-weight: 800; }
.ico { width: 46px; height: 46px; border-radius: 50%; background: var(--sup2); border: 1px solid var(--borda); display: grid; place-items: center; flex: none; font-size: 18px; }
.barra { height: 5px; border-radius: 9px; background: var(--sup3); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--c, var(--brasa)); border-radius: 9px; transition: width .4s; }
.secao { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 12px; }
.secao button { color: var(--brasa); font-weight: 700; font-size: 13px; }
.linhaBrasa { width: 36px; height: 3px; border-radius: 9px; background: linear-gradient(90deg, var(--c, var(--brasa)), transparent); flex: none; }

/* demonstração: duas fotos alternando */
.demo { position: relative; overflow: hidden; border-radius: 20px; background: var(--sup2); aspect-ratio: 1.45; max-width: 100%; }
.demo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); }
.demo.anim img:last-of-type { animation: troca 2.6s ease-in-out infinite; }
.demo.anim img { animation: zoom 5.2s ease-in-out infinite; }
.demo.a3d { background: #1B1713; }
.demo.a3d i { position: absolute; top: -6%; height: 112%; aspect-ratio: 1; left: 50%; transform: translateX(-50%); background-repeat: no-repeat;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
.demo.a3d::after { background: linear-gradient(transparent 70%, rgba(0,0,0,.25)); }
.demo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(0,0,0,.5)); }
.demo .sem { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 44px; color: var(--c, var(--brasa)); background: radial-gradient(color-mix(in srgb, var(--c, var(--brasa)) 30%, transparent), var(--sup2)); }
@keyframes troca { 0%, 38% { opacity: 0 } 50%, 88% { opacity: 1 } 100% { opacity: 0 } }
@keyframes zoom { 50% { transform: scale(1.08) } }
@media (prefers-reduced-motion: reduce) { .demo.anim img { animation: none !important; } }
.mini { width: 64px; height: 64px; aspect-ratio: 1; border-radius: 14px; flex: none; }

/* abas */
.abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px max(14px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.abas nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; border-radius: 28px; background: rgba(30,27,24,.96); border: 1px solid var(--borda); box-shadow: 0 18px 40px rgba(0,0,0,.5); pointer-events: auto; }
.abas button { padding: 8px 2px; border-radius: 22px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 800; color: var(--texto3); }
.abas button[aria-current="page"] { background: rgba(255,91,34,.14); color: var(--texto); }
.abas button span { font-size: 19px; line-height: 1; }

/* questionário */
.opc { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 18px; background: var(--sup1); border: 1.5px solid var(--borda); }
.opc[aria-pressed="true"] { border-color: var(--c, var(--brasa)); background: color-mix(in srgb, var(--c, var(--brasa)) 12%, var(--sup1)); }
.opc .marca { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--texto3); flex: none; display: grid; place-items: center; font-size: 14px; color: var(--fundo); }
.opc[aria-pressed="true"] .marca { background: var(--c, var(--brasa)); border-color: var(--c, var(--brasa)); }
.bola { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); font-size: 19px; }
.numero { font-family: var(--display); font-weight: 900; font-size: 96px; line-height: .9; text-align: center; min-width: 140px; }
input[type=text] { width: 100%; background: var(--sup1); border: 1px solid var(--borda); border-radius: 18px; padding: 18px; color: var(--texto); font-family: var(--display); font-size: 30px; font-weight: 800; }
input[type=text]::placeholder { color: var(--texto3); }

/* herói */
.heroi { position: relative; border-radius: 28px; overflow: hidden; border: 1px solid var(--borda); background: var(--sup2); min-height: 360px; display: flex; flex-direction: column; justify-content: flex-end; }
.heroi > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.heroi::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.2) 38%, rgba(14,13,12,.85) 70%, var(--fundo) 96%); }
.heroi .etq:not(.cheia) { background: rgba(14,13,12,.75); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.fixo { position: sticky; bottom: 0; padding: 18px 0 calc(12px + env(safe-area-inset-bottom,0px)); background: linear-gradient(transparent, var(--fundo) 35%); }
.heroi > * { position: relative; }
.heroi .topo { position: absolute; top: 16px; left: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.dia { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--texto3); }
.dia i { width: 40px; height: 40px; max-width: 100%; border-radius: 50%; border: 1px solid var(--borda); display: grid; place-items: center; font-style: normal; background: var(--sup1); }
.dia.tem i { border-color: var(--c); }
.dia.tem i::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.dia.hoje { color: var(--texto); } .dia.hoje i { border-width: 2px; background: var(--sup3); }
.trilho { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
.trilho > * { flex: none; }
.chip { padding: 9px 16px; border-radius: 99px; background: var(--sup1); border: 1px solid var(--borda); font-weight: 700; font-size: 13px; color: var(--texto2); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--c, var(--brasa)); color: var(--fundo); border-color: var(--c, var(--brasa)); }
.semana { width: 78px; padding: 12px 0; border-radius: 18px; background: var(--sup1); border: 1px solid var(--borda); text-align: center; }
.semana[aria-pressed="true"] { background: var(--c); color: var(--fundo); }
.semana .num { font-size: 24px; }
.semana small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; opacity: .75; margin-top: 3px; }
.item { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 8px 0; }
.grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grade button { text-align: left; background: var(--sup1); border: 1px solid var(--borda); border-radius: 20px; overflow: hidden; }
.grade .demo { border-radius: 0; aspect-ratio: 1.25; }
.grade b { display: block; font-size: 13px; line-height: 1.3; padding: 10px 12px 2px; min-height: 2.6em; }
.grade small { display: block; padding: 0 12px 12px; color: var(--texto3); font-size: 12px; }
.busca { width: 100%; background: var(--sup1); border: 1px solid var(--borda); border-radius: 18px; padding: 14px 16px; color: var(--texto); font: inherit; }
.anel { width: 210px; height: 210px; margin: 0 auto; position: relative; display: grid; place-items: center; }
.anel svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.anel .num { font-size: 72px; }
.contador { display: flex; align-items: center; gap: 8px; }
.contador .num { flex: 1; text-align: center; font-size: 40px; }
.aviso { display: flex; gap: 10px; padding: 14px; border-radius: 16px; background: rgba(251,191,36,.1); font-size: 13px; }
.sobre { position: fixed; inset: 0; z-index: 8; background: rgba(14,13,12,.985); display: flex; flex-direction: column; align-items: center; padding: calc(24px + env(safe-area-inset-top,0px)) max(24px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px, env(safe-area-inset-left,0px)); }
.sobre > div { width: 100%; max-width: 432px; display: flex; flex-direction: column; gap: 16px; height: 100%; }
.mosaico { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; }
.mosaico img { width: 100%; height: 100%; object-fit: cover; border-radius: 22px; display: block; }
.mosaico .col { display: grid; gap: 8px; }
.carregando { min-height: 60vh; display: grid; place-items: center; color: var(--texto3); }
</style>
</head>
<body>

<div id="app"><div class="carregando">Carregando o Forja…</div></div>
<div class="abas" id="abas" hidden><nav aria-label="Seções">
  <button data-aba="hoje"><span>🔥</span>Hoje</button>
  <button data-aba="plano"><span>▦</span>Plano</button>
  <button data-aba="mob"><span>◌</span>Mobilidade</button>
  <button data-aba="ex"><span>◆</span>Exercícios</button>
</nav></div>

<script>
const CORES = { academia: "#FF5B22", casa_corpo: "#F2B24C", casa_elastico: "#E879A6", corrida: "#34D399", bike: "#38BDF8", luta: "#F43F5E", atleta: "#A78BFA", hiit: "#FACC15", hibrido: "#FB923C", mobilidade: "#5EEAD4", longevidade: "#A3E635" };
const TIPO_COR = { corrida: CORES.corrida, bike: CORES.bike, luta: CORES.luta, hiit: CORES.hiit, mobilidade: CORES.mobilidade, cardio: "#7DD3FC", atleta: CORES.atleta };
const SIMB = { academia: "🏋", casa_corpo: "⌂", casa_elastico: "∞", corrida: "🏃", bike: "🚴", luta: "🥊", atleta: "🏆", hiit: "⚡", hibrido: "⇄", mobilidade: "◌", longevidade: "✦" };
const DIAS = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];
const FORCA = ["academia", "casa_corpo", "casa_elastico", "hibrido", "hiit"];
let D, EX = {}, estado = { tela: "boas", aba: "hoje", resp: {}, etapa: 0, semanaSel: 1 };
const $app = document.getElementById("app"), $abas = document.getElementById("abas");

function ler(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function gravar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tempo = s => s >= 3600 ? `${Math.floor(s / 3600)}h${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}` : s >= 60 && s % 60 === 0 ? `${s / 60} min` : s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : `${s} s`;
const presc = (it, circ) => circ ? (it.r || tempo(it.t || 0)) : it.r ? `${it.s} × ${it.r}` : it.s === 1 ? tempo(it.t) : it.d > 0 ? `${it.s} × ${tempo(it.t)} / ${tempo(it.d)}` : `${it.s} × ${tempo(it.t)}`;

let ANIM = {};
function quadroPos(a, q) {
  const lin = Math.ceil(a.f / a.c), col = q % a.c, li = Math.floor(q / a.c);
  return `${a.c > 1 ? col / (a.c - 1) * 100 : 0}% ${lin > 1 ? li / (lin - 1) * 100 : 0}%`;
}
// um único relógio avança todas as animações 3D visíveis
setInterval(() => {
  document.querySelectorAll('i[data-anim="1"]').forEach(el => {
    const a = ANIM[el.dataset.a3d]; if (!a) return;
    const q = (Number(el.dataset.q) + 1) % a.f; el.dataset.q = q; el.style.backgroundPosition = quadroPos(a, q);
  });
}, 1000 / 6);

function demo(id, cls = "", animar = true, cor) {
  const e = EX[id]; const c = cor ? `style="--c:${cor}"` : "";
  const a = ANIM[id];
  if (a) {
    const lin = Math.ceil(a.f / a.c), q = animar ? 0 : Math.floor(a.f / 2);
    return `<div class="demo a3d ${cls}" ${c} role="img" aria-label="Demonstração 3D: ${esc(e?.nome || id)}"><i data-a3d="${id}" data-q="${q}" data-anim="${animar ? 1 : 0}" style="background-image:url(anim3d/${id}.webp);background-size:${a.c * 100}% ${lin * 100}%;background-position:${quadroPos(a, q)}"></i></div>`;
  }
  if (!e || !e.img) return `<div class="demo ${cls}" ${c}><div class="sem">${esc((e?.nome || "?")[0])}</div></div>`;
  return `<div class="demo ${animar ? "anim" : ""} ${cls}" ${c}><img src="img/${id}_0.webp" alt="Demonstração: ${esc(e.nome)}" loading="lazy"><img src="img/${id}_1.webp" alt="" loading="lazy"></div>`;
}

// ---------------------------------------------------------------- perguntas (subconjunto da versão completa)
const IDS_WEB = ["nome", "modalidade", "objetivo", "experiencia", "corrida_meta", "dias"];
function perguntasVisiveis() {
  const m = estado.resp.modalidade;
  return D.perguntas.filter(q => IDS_WEB.includes(q.id)).filter(q =>
    q.id === "objetivo" ? FORCA.includes(m) : q.id === "corrida_meta" ? m === "corrida" : true);
}
function chavePlano() {
  const r = estado.resp, m = r.modalidade;
  const o = FORCA.includes(m) ? (r.objetivo || "massa") : "_";
  let meta = "_";
  if (m === "corrida") meta = ["comecar", "5k", "10k", "21k", "42k"].includes(r.corrida_meta) ? r.corrida_meta : "saude";
  return `${m}|${r.experiencia}|${r.dias || 3}|${o}|${meta}`;
}
function plano() { return D.planos[chavePlano()]; }
function sessao(i) { return D.sessoes[plano().s1[i]]; }

function render() {
  window.scrollTo(0, 0);
  $abas.hidden = estado.tela !== "app";
  if (estado.tela === "boas") return telaBoas();
  if (estado.tela === "quiz") return telaQuiz();
  if (estado.tela === "gerando") return telaGerando();
  if (estado.tela === "sessao") return telaSessao();
  if (estado.tela === "rotina") return telaSessao(true);
  if (estado.tela === "exercicio") return telaExercicio();
  if (estado.tela === "treino") return telaTreino();
  $abas.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", b.dataset.aba === estado.aba ? "page" : "false"));
  ({ hoje: telaHoje, plano: telaPlano, mob: telaMob, ex: telaEx })[estado.aba]();
}
function ir(tela, extra = {}) { estado.voltar = { tela: estado.tela, aba: estado.aba, id: estado.id, idx: estado.idx }; Object.assign(estado, { tela }, extra); render(); }

function telaBoas() {
  $app.innerHTML = `
  <div class="pilha" style="gap:20px">
    <div class="mosaico" aria-hidden="true"><img src="img/agachamento-barra_1.webp" alt="" style="aspect-ratio:.72"><div class="col"><img src="img/swing_1.webp" alt=""><img src="img/corrida-leve_1.webp" alt=""></div></div>
    <div class="linhaBrasa" style="width:56px"></div>
    <div><h1 style="font-size:84px;letter-spacing:.03em">FORJA</h1><h2 style="color:var(--brasa)">Treino sob medida.</h2></div>
    <p class="mut">Responda algumas perguntas e receba uma rotina completa: musculação, casa, corrida, bike, lutas, atletas, HIIT, mobilidade e mais, com demonstração e vídeo de cada exercício.</p>
    <button class="btn" id="comecar">Montar minha rotina →</button>
    <p class="peq mut3" style="text-align:center">Versão web de demonstração · o app Android tem o questionário completo, histórico e lembretes</p>
  </div>`;
  document.getElementById("comecar").onclick = () => { estado.etapa = 0; ir("quiz"); };
}

function telaQuiz() {
  const vis = perguntasVisiveis(); const i = Math.min(estado.etapa, vis.length - 1); const q = vis[i]; const r = estado.resp;
  if (q.tipo === "NUMERO" && r[q.id] == null) r[q.id] = q.padrao;
  const val = r[q.id];
  let corpo = "";
  if (q.tipo === "TEXTO") corpo = `<input type="text" id="nome" placeholder="Seu nome" maxlength="24" value="${esc(val || "")}" autocomplete="given-name">`;
  else if (q.tipo === "UNICA") corpo = `<div class="pilha" style="gap:10px">${q.opcoes.map(o => {
    const cor = q.id === "modalidade" ? CORES[o.v] : "var(--brasa)";
    return `<button class="opc" data-v="${o.v}" aria-pressed="${val === o.v}" style="--c:${cor}">${q.id === "modalidade" ? `<span class="bola">${SIMB[o.v]}</span>` : ""}<span class="cresce"><b>${esc(o.t)}</b>${o.d ? `<br><span class="peq mut">${esc(o.d)}</span>` : ""}</span><span class="marca">${val === o.v ? "✓" : ""}</span></button>`;
  }).join("")}</div>`;
  else if (q.tipo === "NUMERO") corpo = `<div class="linha" style="justify-content:center;gap:20px"><button class="ico" id="menos" aria-label="Diminuir" style="width:58px;height:58px">−</button><div><div class="numero">${val}</div><div class="rotulo" style="text-align:center;color:var(--brasa)">${q.unidade}</div></div><button class="ico" id="mais" aria-label="Aumentar" style="width:58px;height:58px">+</button></div>
    <p class="mut" style="text-align:center;margin-top:18px">${["", "", "Ótimo para começar e manter.", "O ponto ideal para a maioria.", "Permite dividir em superiores e inferiores.", "Volume alto: durma bem.", "Para quem já tem rotina consolidada."][val] || ""}</p>`;
  const ok = q.tipo === "TEXTO" || val != null;
  $app.innerHTML = `
  <div class="linha" style="padding:6px 0 14px"><button class="ico" id="voltar" aria-label="Voltar">←</button>

let T = null, relogio = null, wake = null;
function passos(s) {
  const out = [];
  s.blocos.forEach(b => {
    if (b.tipo === "CIRCUITO") for (let v = 1; v <= b.voltas; v++) b.itens.forEach((it, k) => out.push({ b, it, serie: v, total: b.voltas, circ: true, desc: k === b.itens.length - 1 && v < b.voltas ? Math.max(it.d, 60) : it.d }));
    else b.itens.forEach(it => { for (let r = 1; r <= it.s; r++) out.push({ b, it, serie: r, total: it.s, circ: false, desc: it.d }); });
  });
  if (out.length) out[out.length - 1].desc = 0;
  return out;
}
async function iniciarTreino(s, cor) {
  T = { s, cor, p: passos(s), i: 0, fim: null, pausa: null, descanso: false, ini: Date.now(), reps: {} };
  try { wake = await navigator.wakeLock?.request("screen"); } catch {}
  ir("treino");
}

function bip(f = 880, d = .12) { try { audio = audio || new AudioContext(); const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = f; g.gain.value = .08; o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + d); } catch {} }

  clearInterval(relogio);
  const pa = T.p[T.i]; const e = EX[pa.it.e]; const cor = T.cor; const porTempo = pa.it.t != null;
  const resta = () => T.pausa ?? (T.fim ? Math.max(0, T.fim - Date.now()) : null);
  const rot = pa.circ ? `Volta ${pa.serie} de ${pa.total}` : pa.total > 1 ? `Série ${pa.serie} de ${pa.total}` : "Série única";
  if (T.descanso) {
    const prox = T.p[T.i + 1];
    $app.innerHTML = `<div class="pilha" style="gap:22px;align-items:center;padding-top:30px;text-align:center">
      <div class="rotulo" style="color:${cor}">Descanso</div>

      <div class="linha"><button class="btn2" id="m15">−15 s</button><button class="btn2" id="p15">+15 s</button></div>
      ${prox ? `<div style="width:100%;text-align:left"><div class="rotulo" style="margin-bottom:10px">A seguir</div><div class="cartao linha">${demo(prox.it.e, "mini", true, cor)}<div class="cresce"><b>${esc(EX[prox.it.e]?.nome)}</b><br><span class="peq mut">${prox.circ ? `Volta ${prox.serie}` : `Série ${prox.serie} de ${prox.total}`}</span></div></div></div>` : ""}
      <button class="btn ${cor !== CORES.academia ? "cor" : ""}" style="--c:${cor}" id="pular">Pular descanso ⏭</button></div>`;
    document.getElementById("m15").onclick = () => { T.fim = Math.max(Date.now() + 1000, T.fim - 15000); };
    document.getElementById("p15").onclick = () => { T.fim += 15000; };
    document.getElementById("pular").onclick = () => proximo(true);
  } else {
    $app.innerHTML = `
    <div class="linha" style="padding:6px 0 10px"><button class="ico" id="sair" aria-label="Sair do treino">✕</button><div class="cresce" style="text-align:center"><div class="num" id="decorrido" style="font-size:24px">0:00</div><div class="rotulo" style="color:${cor}">${esc(pa.b.nome)}</div></div>
      <a class="ico" href="${e.video ? `https://www.youtube.com/watch?v=${e.video.id}` : `https://www.youtube.com/results?search_query=${encodeURIComponent(e.busca)}`}" target="_blank" rel="noopener" aria-label="Ver vídeo" style="color:${cor};text-decoration:none">▶</a></div>
    <div class="barra" style="--c:${cor}"><i style="width:${T.i / T.p.length * 100}%"></i></div>
    <div class="pilha" style="gap:12px;margin-top:14px">
      ${demo(e.id, "", true, cor)}
      <div class="linha" style="justify-content:space-between"><span class="rotulo" style="color:${cor}">${rot}</span><span class="peq mut3">${T.i + 1} / ${T.p.length}</span></div>
      <h1>${esc(e.nome)}</h1>
      <div class="linha" style="gap:8px;flex-wrap:wrap"><span class="etq cheia" style="--c:${cor}">${porTempo ? tempo(pa.it.t) : pa.it.r + " reps"}</span>${pa.it.i ? `<span class="etq" style="--c:${cor}">${esc(pa.it.i)}</span>` : ""}</div>
      ${pa.it.n ? `<p class="peq mut">${esc(pa.it.n)}</p>` : ""}
      ${porTempo ? `<div class="anel" id="anel"></div>` : `<div class="cartao"><div class="rotulo">Repetições feitas</div><div class="contador" style="margin-top:6px"><button class="ico" id="rm" aria-label="Menos repetições">−</button><span class="num" id="reps">${T.reps[T.i] ?? (parseInt(pa.it.r) || 10)}</span><button class="ico" id="rp" aria-label="Mais repetições">+</button></div></div>`}
      <div class="cartao"><div class="rotulo" style="color:${cor}">Execução</div><ol style="margin:8px 0 0;padding-left:18px" class="peq">${e.dicas.map(d => `<li>${esc(d)}</li>`).join("")}</ol></div>
      <div class="linha fixo"><button class="ico" id="ant" aria-label="Anterior" style="width:54px;height:54px">⏮</button>
        <button class="btn ${cor !== CORES.academia ? "cor" : ""} cresce" style="--c:${cor}" id="principal"></button>
        <button class="ico" id="prox" aria-label="Pular" style="width:54px;height:54px">⏭</button></div>
    </div>`;
    document.getElementById("sair").onclick = () => sairTreino();
    document.getElementById("ant").onclick = () => { T.i = Math.max(0, T.i - 1); T.fim = T.pausa = null; render(); };
    document.getElementById("prox").onclick = () => concluir();
    const btn = document.getElementById("principal");
    if (porTempo) btn.onclick = () => { if (T.fim && T.pausa == null) T.pausa = Math.max(0, T.fim - Date.now()); else if (T.pausa != null) { T.fim = Date.now() + T.pausa; T.pausa = null; } else T.fim = Date.now() + pa.it.t * 1000; atualizar(); };
    else {
      btn.textContent = T.i === T.p.length - 1 ? "✓ Finalizar treino" : "✓ Concluir série"; btn.onclick = () => concluir();
      const n = document.getElementById("reps"); let v = +n.textContent || 0;
      document.getElementById("rm").onclick = () => { v = Math.max(0, v - 1); n.textContent = v; T.reps[T.i] = v; };
      document.getElementById("rp").onclick = () => { v++; n.textContent = v; T.reps[T.i] = v; };
    }
  }
  let ultimo = -1;
  function atualizar() {
    const d = Math.floor((Date.now() - T.ini) / 1000); const el = document.getElementById("decorrido"); if (el) el.textContent = `${Math.floor(d / 60)}:${String(d % 60).padStart(2, "0")}`;
    const r = resta(); const seg = r == null ? (porTempo && !T.descanso ? pa.it.t : 0) : Math.ceil(r / 1000);
    const total = T.descanso ? pa.desc : (pa.it.t || 1); const frac = r == null ? 0 : (T.descanso ? r / 1000 / total : 1 - r / 1000 / total);
    const anel = document.getElementById("anel");
    if (anel) anel.innerHTML = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--sup3)" stroke-width="6"/><circle cx="50" cy="50" r="45" fill="none" stroke="${cor}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${2 * Math.PI * 45}" stroke-dashoffset="${2 * Math.PI * 45 * (1 - frac)}"/></svg><div><div class="num">${seg >= 60 ? `${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, "0")}` : seg}</div>${!T.descanso ? `<div class="peq mut">${T.fim == null ? "toque em iniciar" : T.pausa != null ? "pausado" : "em andamento"}</div>` : ""}</div>`;
    const btn = document.getElementById("principal"); if (btn && porTempo) btn.textContent = T.fim && T.pausa == null ? "❚❚ Pausar" : T.pausa != null ? "▶ Continuar" : "▶ Iniciar";
    if (r != null && T.pausa == null) {
      if (seg <= 3 && seg >= 1 && seg !== ultimo) { ultimo = seg; bip(); }
      if (r === 0) { bip(1320, .3); if (T.descanso) proximo(true); else concluir(); }
    }
  }
  atualizar(); relogio = setInterval(atualizar, 200);
}
function concluir() {
  const pa = T.p[T.i];
  if (T.i >= T.p.length - 1) return terminar();
  if (pa.desc > 0) { T.descanso = true; T.fim = Date.now() + pa.desc * 1000; T.pausa = null; render(); } else proximo(false);
}
function proximo(auto) {
  const ant = T.p[T.i]; T.descanso = false; T.fim = T.pausa = null; T.i++;
  if (T.i >= T.p.length) return terminar();
  const novo = T.p[T.i];
  if (auto && novo.it.t != null && ant.it.t != null && ant.b === novo.b) T.fim = Date.now() + novo.it.t * 1000;
  render();
}
function sairTreino() { clearInterval(relogio); try { wake?.release(); } catch {} T = null; estado.tela = "app"; render(); }
function terminar() {
  clearInterval(relogio); try { wake?.release(); } catch {}
  const min = Math.round((Date.now() - T.ini) / 60000); const cor = T.cor; const s = T.s;
  $app.innerHTML = `<div class="pilha" style="gap:18px;align-items:center;text-align:center;padding-top:40px">
    <div style="width:96px;height:96px;border-radius:50%;background:${cor};display:grid;place-items:center;font-size:44px;color:var(--fundo)">✓</div>
    <div class="rotulo" style="color:${cor}">Treino concluído</div><h1>${esc(s.titulo)}</h1>
    <div class="linha" style="width:100%"><div class="cartao cresce"><div class="num">${min}</div><span class="peq mut">minutos</span></div><div class="cartao cresce"><div class="num">${T.i + 1}</div><span class="peq mut">séries/etapas</span></div></div>
    <p class="mut peq">No app Android o treino fica salvo no histórico, com cargas, recordes e gráfico semanal.</p>
    <button class="btn" id="fim">Voltar ao início</button></div>`;
  T = null;
  document.getElementById("fim").onclick = () => { estado.tela = "app"; estado.aba = "hoje"; render(); };
}

$abas.querySelectorAll("button").forEach(b => b.onclick = () => { estado.aba = b.dataset.aba; estado.tela = "app"; render(); });

(async function iniciar() {
  try {
    const [dados, ex] = await Promise.all([fetch("dados.json").then(r => r.json()), fetch("exercicios.json").then(r => r.json())]);
    ANIM = await fetch("anim3d/meta.json").then(r => r.ok ? r.json() : {}).catch(() => ({}));
    D = dados; ex.forEach(e => EX[e.id] = e);
    const salvo = ler("forja_resp");
    if (salvo && salvo.modalidade && D.planos) { estado.resp = salvo; if (plano()) estado.tela = "app"; }
    if (!estado.resp.modalidade) estado.resp = {};
    render();
  } catch (err) {
    $app.innerHTML = `<div class="carregando"><p>Não consegui carregar os dados do Forja. Recarregue a página.</p></div>`;
  }
})();
</script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
