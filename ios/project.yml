name: Forja
options:
  bundleIdPrefix: com.forja
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
packages:
  ForjaCore:
    path: ForjaCore
targets:
  Forja:
    type: application
    platform: iOS
    sources:
      - path: Forja/App
      - path: Forja/Assets.xcassets
      - path: Forja/Recursos/Fontes
        buildPhase: resources
      - path: ../app/src/main/assets/img
        type: folder
        buildPhase: resources
      - path: ../app/src/main/assets/video3d
        type: folder
        buildPhase: resources
      - path: ../app/src/main/assets/conteudo2.json
        buildPhase: resources
      - path: ../app/src/main/assets/exercises.json
        buildPhase: resources
      - path: ../app/src/main/assets/fontes.json
        buildPhase: resources
    dependencies:
      - package: ForjaCore
    info:
      path: Forja/Info.plist
      properties:
        CFBundleDisplayName: Forja
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR]
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: Fundo
        UIAppFonts:
          - BigShouldersDisplay-ExtraBold.ttf
          - BigShouldersDisplay-Black.ttf
          - Manrope-Medium.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaiquecupertino.forja
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: NO
