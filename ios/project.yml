name: Forja
options:
  bundleIdPrefix: com.forja
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
packages:
  ForjaCore:
    path: ForjaCore
targets:
  Forja:
    type: application
    platform: iOS
    sources:
      - path: Forja/App
      - path: Compartilhado
      - path: Forja/Assets.xcassets
      - path: Forja/Recursos/Fontes
        buildPhase: resources
      - path: Forja/Recursos/Privacidade/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../app/src/main/assets/img
        type: folder
        buildPhase: resources
      - path: ../app/src/main/assets/video3d
        type: folder
        buildPhase: resources
      - path: ../app/src/main/assets/conteudo2.json
        buildPhase: resources
      - path: ../app/src/main/assets/exercises.json
        buildPhase: resources
      - path: ../app/src/main/assets/fontes.json
        buildPhase: resources
    dependencies:
      - package: ForjaCore
      - target: ForjaWidgets
    entitlements:
      path: Forja/Forja.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Forja/Info.plist
      properties:
        CFBundleDisplayName: Forja
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR]
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: Fundo
        UIAppFonts:
          - BigShouldersDisplay-ExtraBold.ttf
          - BigShouldersDisplay-Black.ttf
          - Manrope-Medium.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "O Forja lê a frequência cardíaca registrada pelo seu Apple Watch ou outro relógio no app Saúde para mostrar a FC média e máxima de cada treino."
        NSHealthUpdateUsageDescription: "O Forja grava seus treinos no app Saúde (tipo, duração e calorias estimadas) para somar aos seus anéis e ao histórico de atividade."
        NSBluetoothAlwaysUsageDescription: "O Forja conecta à sua cinta cardíaca ou relógio por Bluetooth para mostrar os batimentos ao vivo durante o treino."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaiquecupertino.forja
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: NO
  ForjaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: ForjaWidgets
      - path: Compartilhado
      - path: ForjaWidgetsRecursos/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: ForjaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Forja
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaiquecupertino.forja.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: NO
        APPLICATION_EXTENSION_API_ONLY: YES
